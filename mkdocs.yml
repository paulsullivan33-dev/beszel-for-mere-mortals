site_name: Beszel for Mere Mortals
site_description: A lightweight monitoring system for your own machines. One small hub with a web dashboard, an agent on each machine you watch, a history of processor, memory, disk and network use, and alerts when a number stays wrong, explained in plain language with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/beszel-for-mere-mortals/
